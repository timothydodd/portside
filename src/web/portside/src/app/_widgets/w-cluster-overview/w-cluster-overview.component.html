<div class="cluster-overview-widget">
  <div class="widget-header">
    <div class="header-content">
      <svg lucideIcon="activity" class="header-icon"></svg>
      <h3>Cluster Overview</h3>
    </div>
    @if (cluster()) {
      <div class="header-kpis">
        <span class="kpi" title="CPU usage">
          <svg lucideIcon="cpu"></svg>
          <app-flash-label [value]="cpuUsagePercent() + '%'" />
        </span>
        <span class="kpi" title="Memory usage">
          <svg lucideIcon="memory-stick"></svg>
          <app-flash-label [value]="memoryUsagePercent() + '%'" />
        </span>
        <span class="kpi" title="Nodes">
          <svg lucideIcon="server"></svg>
          <app-flash-label [value]="nodeCount()" />
        </span>
      </div>
    }
  </div>

  @if (loading() && !cluster()) {
    <div class="loading-state">
      <app-loading-spinner />
      <p>Loading cluster metrics...</p>
    </div>
  } @else if (error()) {
    <div class="error-state">
      <svg lucideIcon="alert-circle" class="error-icon"></svg>
      <p>{{ error() }}</p>
      <button (click)="retry()" class="retry-btn">
        <svg lucideIcon="refresh-cw"></svg>
        Retry
      </button>
    </div>
  } @else if (cluster()) {
    <div class="cluster-body">
      <div class="cluster-summary">
        <div class="meter">
          <div class="meter-head">
            <span><svg lucideIcon="cpu"></svg> CPU</span>
            <span class="meter-value">
              <app-flash-label [value]="formatCPU(cluster()!.cpuUsage) + ' / ' + formatCPU(cluster()!.cpuTotal)" />
            </span>
          </div>
          <div class="bar-track"><div class="bar-fill cpu" [style.width.%]="cpuUsagePercent()"></div></div>
        </div>
        <div class="meter">
          <div class="meter-head">
            <span><svg lucideIcon="memory-stick"></svg> Memory</span>
            <span class="meter-value">
              <app-flash-label [value]="formatMemory(cluster()!.memoryUsage) + ' / ' + formatMemory(cluster()!.memoryTotal)" />
            </span>
          </div>
          <div class="bar-track"><div class="bar-fill mem" [style.width.%]="memoryUsagePercent()"></div></div>
        </div>
      </div>

      @if (cluster()!.nodes?.length) {
        <div class="nodes-grid">
          @for (n of cluster()!.nodes; track n.name) {
          <div class="node-card">
            <div class="node-card-head">
              <svg lucideIcon="server"></svg>
              <span class="name" [title]="n.name">{{ n.name }}</span>
            </div>

            <div class="node-card-meter">
              <div class="meter-row">
                <span class="meter-label"><svg lucideIcon="cpu"></svg> CPU</span>
                <span class="meter-pct"><app-flash-label [value]="round(n.cpuPercentage) + '%'" /></span>
              </div>
              <div class="bar-track small"><div class="bar-fill cpu" [style.width.%]="round(n.cpuPercentage)"></div></div>
            </div>

            <div class="node-card-meter">
              <div class="meter-row">
                <span class="meter-label"><svg lucideIcon="memory-stick"></svg> Memory</span>
                <span class="meter-pct"><app-flash-label [value]="round(n.memoryPercentage) + '% | ' + formatMemory(n.memoryUsage)" /></span>
              </div>
              <div class="bar-track small"><div class="bar-fill mem" [style.width.%]="round(n.memoryPercentage)"></div></div>
            </div>
          </div>
          }
        </div>
      }
    </div>
  }
</div>
